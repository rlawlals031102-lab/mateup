# 쓰는 라이브러리(npm)와 자동 확인 도구(GitHub Actions)에 새 버전이 나오면 GitHub(Dependabot)가 PR을 올려 준다.
#  - npm: 매주 월요일. 작은 업데이트(minor·patch)는 PR 하나로 묶고, 큰 업데이트(major)만 따로 온다.
#  - GitHub Actions: 매달 한 번, PR 하나로 묶는다.
#  - PR마다 자동 확인(CI)이 돈다. test·e2e·postgres가 모두 통과하면 합치고, 실패하면 합치지 말고 그대로 둔다.
#  - 보안 취약점 알림(Dependabot alerts)은 이 파일과 별개로, 저장소 주인이 Settings → Code security 에서 켠다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      npm-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-updates:
        patterns: ['*']
